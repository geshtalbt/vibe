<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PyCamp — интерактивный курс Python</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css" />
  <style>
    :root {
      --navy: #0a0a23;
      --panel: #1b1b32;
      --panel-2: #2a2a40;
      --line: #3b3b4f;
      --text: #f5f6f7;
      --muted: #afb0c0;
      --gold: #f1be32;
      --blue: #99c9ff;
      --green: #57a75a;
      --red: #ff6b6b;
      --sidebar: 300px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--navy); color: var(--text); font-family: "Lato", "Segoe UI", system-ui, sans-serif; }
    a { color: var(--blue); }
    button, input { font: inherit; }
    .cm-s-material-darker.CodeMirror { height: 100%; font-size: 14px; background: #0e0e1a; }
    .CodeMirror-gutters { background: #0e0e1a !important; border: 0; }

    #boot {
      position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
      background: var(--navy); text-align: center; padding: 24px;
    }
    #boot[hidden] { display: none !important; }
    #boot h1 { color: var(--gold); letter-spacing: .08em; margin: 0 0 12px; }
    .spinner { width: 42px; height: 42px; border: 3px solid var(--line); border-top-color: var(--gold); border-radius: 50%; margin: 18px auto; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    header.app {
      min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 8px 16px;
      background: #002ead; border-bottom: 1px solid #0036c7; flex-shrink: 0; flex-wrap: wrap;
    }
    .brand { font-weight: 800; letter-spacing: .04em; cursor: pointer; white-space: nowrap; }
    .brand span { color: var(--gold); }
    .progress-wrap { flex: 1; max-width: 420px; }
    .progress-label { font-size: 12px; color: #d0d0ff; margin-bottom: 4px; }
    .bar { height: 8px; background: #001a6e; border-radius: 99px; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .25s; }
    .hdr-actions { margin-left: auto; display: flex; gap: 8px; }
    .btn {
      background: var(--gold); color: #0a0a23; border: 0; border-radius: 0; padding: 7px 12px;
      font-weight: 700; cursor: pointer; font-size: 13px; white-space: nowrap;
    }
    .btn.ghost { background: transparent; color: #fff; border: 2px solid #fff; }
    .btn.ok { background: var(--green); color: #fff; }
    .btn.danger { background: transparent; color: #fff; border: 2px solid #ff8a8a; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .layout { display: grid; grid-template-columns: var(--sidebar) 1fr; height: calc(100% - 64px); min-height: 0; }
    aside.nav {
      background: var(--navy); border-right: 1px solid var(--line); overflow: auto; padding: 12px 0 40px;
    }
    .search { margin: 8px 12px 14px; }
    .search input {
      width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text);
      padding: 8px 10px; border-radius: 4px;
    }
    .sec-title {
      padding: 10px 14px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
      color: var(--gold); cursor: pointer; display: flex; justify-content: space-between;
    }
    .sec-title small { color: var(--muted); letter-spacing: 0; text-transform: none; }
    .lesson-link {
      display: flex; gap: 8px; align-items: flex-start; padding: 7px 14px 7px 18px;
      cursor: pointer; font-size: 13.5px; color: var(--muted); border-left: 3px solid transparent;
    }
    .lesson-link:hover { background: var(--panel); color: var(--text); }
    .lesson-link.active { background: var(--panel-2); color: #fff; border-left-color: var(--gold); }
    .mark { width: 14px; flex: 0 0 14px; color: var(--green); }

    main.workspace { display: grid; grid-template-rows: 1fr 1fr; min-width: 0; }
    .theory {
      overflow: auto; padding: 22px 28px 40px; background: var(--panel); border-bottom: 1px solid var(--line);
    }
    .theory h2 { margin: 0 0 8px; font-size: 28px; }
    .kicker { color: var(--gold); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
    .theory p, .theory li { line-height: 1.55; color: #e7e7f0; }
    .theory pre, .theory code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px;
    }
    .theory pre {
      background: #0a0a23; border: 1px solid var(--line); padding: 12px 14px; overflow: auto;
    }
    .theory code { background: #0a0a23; padding: 1px 5px; }
    .hint-box {
      display: none; margin-top: 16px; padding: 12px 14px; border-left: 4px solid var(--gold);
      background: #2a2610;
    }

    .lab { display: grid; grid-template-columns: 1.15fr .85fr; min-height: 0; }
    .editor-col, .out-col { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .lab-bar {
      display: flex; gap: 8px; align-items: center; padding: 8px 10px; background: #111; border-bottom: 1px solid var(--line);
      flex-shrink: 0; flex-wrap: wrap;
    }
    .lab-bar span { color: var(--muted); font-size: 12px; margin-right: auto; }
    .out-col { background: #0e0e1a; border-left: 1px solid var(--line); }
    #console {
      flex: 0 0 38%; overflow: auto; padding: 10px 12px; font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 13px; white-space: pre-wrap; color: #cdeccd; border-bottom: 1px solid var(--line);
    }
    #tests { flex: 1; overflow: auto; padding: 10px 12px; }
    .test { display: flex; gap: 8px; padding: 6px 0; font-size: 13px; border-bottom: 1px solid #222; }
    .test.pass { color: #9ee29e; }
    .test.fail { color: #ffb4b4; }
    .home { overflow: auto; padding: 32px 40px 80px; }
    .hero { max-width: 860px; }
    .hero h1 { font-size: 42px; line-height: 1.15; margin: 0 0 12px; }
    .hero p { color: var(--muted); font-size: 18px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-top: 28px; }
    .card {
      background: var(--panel); border: 1px solid var(--line); padding: 16px; cursor: pointer;
    }
    .card:hover { border-color: var(--gold); }
    .card h3 { margin: 0 0 8px; font-size: 16px; }
    .card p { margin: 0; color: var(--muted); font-size: 13px; }
    .cert {
      display: none; margin-top: 28px; padding: 24px; border: 2px solid var(--gold); max-width: 640px;
    }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      aside.nav { max-height: 28vh; }
      .lab { grid-template-columns: 1fr; }
      .out-col { border-left: 0; border-top: 1px solid var(--line); min-height: 220px; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div>
      <h1>PyCamp</h1>
      <p>Загружается Python в браузере (Pyodide)…</p>
      <div class="spinner"></div>
      <p id="boot-msg" style="color:#afb0c0">Это займёт несколько секунд при первом запуске</p>
    </div>
  </div>

  <header class="app">
    <div class="brand" id="go-home">Py<span>Camp</span></div>
    <div class="progress-wrap">
      <div class="progress-label" id="prog-text">0 / 0 заданий</div>
      <div class="bar"><i id="prog-bar"></i></div>
    </div>
    <div class="hdr-actions">
      <button class="btn ghost" id="btn-map" type="button">Карта курса</button>
      <button class="btn danger" id="btn-reset" type="button">Сбросить прогресс</button>
    </div>
  </header>

  <div class="layout">
    <aside class="nav" id="nav"></aside>
    <div id="stage"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <script>
const COURSE = [
  {
    id: "intro",
    title: "Знакомство с Python",
    blurb: "Синтаксис, print и первая программа.",
    lessons: [
      {
        id: "hello",
        title: "Hello, Python",
        theory: `
          <p>Python — язык общего назначения: на нём пишут скрипты, веб-сервисы, анализ данных и автоматизацию.</p>
          <p>Первая программа почти всегда выводит текст. Функция <code>print()</code> отправляет значение в консоль.</p>
          <pre>print("Hello, Python!")</pre>
          <p>Строки заключают в кавычки — одинарные или двойные.</p>
          <p><b>Задание:</b> выведите ровно <code>Hello, Python!</code></p>`,
        hint: "Вызов выглядит так: print(\"Hello, Python!\")",
        starter: 'print("")\n',
        checks: [{ desc: "В выводе есть Hello, Python!", stdoutIncludes: "Hello, Python!" }]
      },
      {
        id: "print-many",
        title: "Несколько выводов",
        theory: `
          <p>Каждый <code>print</code> по умолчанию заканчивается переводом строки. Можно вызвать функцию несколько раз.</p>
          <pre>print("строка 1")\nprint("строка 2")</pre>
          <p><b>Задание:</b> выведите три строки: <code>alpha</code>, затем <code>beta</code>, затем <code>gamma</code>.</p>`,
        hint: "Три отдельных вызова print.",
        starter: "# три строки\n",
        checks: [
          { desc: "Есть alpha", stdoutIncludes: "alpha" },
          { desc: "Есть beta", stdoutIncludes: "beta" },
          { desc: "Есть gamma", stdoutIncludes: "gamma" }
        ]
      },
      {
        id: "comments",
        title: "Комментарии",
        theory: `
          <p>Комментарии начинаются с <code>#</code> и игнорируются интерпретатором. Ими объясняют намерение, а не пересказ кода.</p>
          <pre># это комментарий\nprint(1)  # и это тоже</pre>
          <p><b>Задание:</b> оставьте любой комментарий и выведите число <code>42</code>.</p>`,
        hint: "Строка с # и print(42).",
        starter: "\n",
        checks: [
          { desc: "В коде есть комментарий #", py: "assert '#' in _user_src" },
          { desc: "Выведено 42", stdoutIncludes: "42" }
        ]
      },
      {
        id: "sep-end",
        title: "sep и end",
        theory: `
          <p>У <code>print</code> есть аргументы <code>sep</code> (разделитель) и <code>end</code> (чем закончить).</p>
          <pre>print(1, 2, 3, sep="-")  # 1-2-3\nprint("A", end="")\nprint("B")               # AB</pre>
          <p><b>Задание:</b> одной инструкцией <code>print</code> выведите <code>red,green,blue</code> (через запятую, без пробелов).</p>`,
        hint: "print(\"red\", \"green\", \"blue\", sep=\",\")",
        starter: "print()\n",
        checks: [{ desc: "Вывод содержит red,green,blue", stdoutIncludes: "red,green,blue" }]
      }
    ]
  },
  {
    id: "vars",
    title: "Переменные и типы",
    blurb: "Имена, присваивание, type и преобразования.",
    lessons: [
      {
        id: "assign",
        title: "Присваивание",
        theory: `
          <p>Переменная — имя, связанное со значением. В Python тип следует за значением.</p>
          <pre>age = 21\nname = "Ada"</pre>
          <p><b>Задание:</b> создайте <code>language = "Python"</code> и выведите переменную.</p>`,
        hint: "Сначала присвойте, потом print(language).",
        starter: "language = \n",
        checks: [
          { desc: "language равно 'Python'", py: "assert language == 'Python'" },
          { desc: "Выведен Python", stdoutIncludes: "Python" }
        ]
      },
      {
        id: "types",
        title: "Основные типы",
        theory: `
          <p>Частые встроенные типы:</p>
          <ul>
            <li><code>int</code> — целые: <code>7</code></li>
            <li><code>float</code> — вещественные: <code>3.14</code></li>
            <li><code>str</code> — строки: <code>"hi"</code></li>
            <li><code>bool</code> — <code>True</code> / <code>False</code></li>
          </ul>
          <p><code>type(x)</code> возвращает тип объекта.</p>
          <p><b>Задание:</b> переменные <code>n = 10</code>, <code>x = 2.5</code>, <code>ok = True</code>. Выведите <code>type(n)</code>.</p>`,
        hint: "print(type(n)) покажет &lt;class 'int'&gt;.",
        starter: "n = 0\nx = 0\nok = False\nprint()\n",
        checks: [
          { desc: "n это int 10", py: "assert n == 10 and type(n) is int" },
          { desc: "x это float 2.5", py: "assert x == 2.5 and type(x) is float" },
          { desc: "ok это True", py: "assert ok is True" },
          { desc: "В выводе есть int", stdoutIncludes: "int" }
        ]
      },
      {
        id: "cast",
        title: "Преобразование типов",
        theory: `
          <p>Функции <code>int()</code>, <code>float()</code>, <code>str()</code>, <code>bool()</code> конструируют значение другого типа.</p>
          <pre>int("12")     # 12\nfloat("1.5")  # 1.5\nstr(9)        # "9"</pre>
          <p>Пустая строка, <code>0</code>, <code>None</code> и пустые коллекции в <code>bool()</code> дают <code>False</code>.</p>
          <p><b>Задание:</b> <code>raw = "42"</code>. Получите целое <code>value</code> и выведите <code>value + 8</code>.</p>`,
        hint: "value = int(raw)",
        starter: 'raw = "42"\n',
        checks: [
          { desc: "value == 42 и это int", py: "assert value == 42 and type(value) is int" },
          { desc: "Выведено 50", stdoutIncludes: "50" }
        ]
      },
      {
        id: "names",
        title: "Имена и константы",
        theory: `
          <p>Имена: буквы, цифры, <code>_</code>, не начинают с цифры. Стиль — <code>snake_case</code>.</p>
          <p>По соглашению константы пишут КАПСОМ: <code>MAX_SIZE = 100</code>. Это всё ещё обычная переменная.</p>
          <p><b>Задание:</b> <code>MAX_RETRY = 3</code>, <code>user_name = "neo"</code>. Выведите их через пробел в одном print.</p>`,
        hint: "print(MAX_RETRY, user_name)",
        starter: "",
        checks: [
          { desc: "MAX_RETRY == 3", py: "assert MAX_RETRY == 3" },
          { desc: "user_name == 'neo'", py: "assert user_name == 'neo'" },
          { desc: "В выводе есть 3 и neo", py: "assert '3' in _stdout and 'neo' in _stdout" }
        ]
      }
    ]
  },
  {
    id: "numbers",
    title: "Числа и математика",
    blurb: "Арифметика, приоритет, модуль math.",
    lessons: [
      {
        id: "arith",
        title: "Арифметика",
        theory: `
          <p>Операторы: <code>+</code> <code>-</code> <code>*</code> <code>/</code> (всегда float), <code>//</code> (целое деление), <code>%</code> (остаток), <code>**</code> (степень).</p>
          <pre>7 / 2   # 3.5\n7 // 2  # 3\n7 % 2   # 1\n2 ** 3  # 8</pre>
          <p><b>Задание:</b> переменные <code>a = 17</code>, <code>b = 5</code>. Вычислите <code>q = a // b</code>, <code>r = a % b</code>, <code>p = a ** 2</code> и выведите <code>q, r, p</code>.</p>`,
        hint: "17 // 5 = 3, 17 % 5 = 2, 17 ** 2 = 289.",
        starter: "a = 17\nb = 5\n",
        checks: [
          { desc: "q == 3", py: "assert q == 3" },
          { desc: "r == 2", py: "assert r == 2" },
          { desc: "p == 289", py: "assert p == 289" }
        ]
      },
      {
        id: "priority",
        title: "Приоритет операций",
        theory: `
          <p>Сначала скобки, затем <code>**</code>, затем <code>*</code> <code>/</code> <code>//</code> <code>%</code>, затем <code>+</code> <code>-</code>.</p>
          <pre>2 + 3 * 4     # 14\n(2 + 3) * 4   # 20</pre>
          <p><b>Задание:</b> запишите в <code>result</code> выражение <code>(9 + 3) * 2 ** 2 - 10</code> и выведите его. Не подставляйте готовое число вручную — пусть посчитает Python.</p>`,
        hint: "result = (9 + 3) * 2 ** 2 - 10",
        starter: "result = 0\nprint(result)\n",
        checks: [
          { desc: "result == 38", py: "assert result == 38" },
          { desc: "В исходнике есть ** или скобки с 9", py: "assert '**' in _user_src or '(9' in _user_src.replace(' ','')" }
        ]
      },
      {
        id: "builtin-math",
        title: "abs, round, min, max",
        theory: `
          <p>Полезные встроенные функции:</p>
          <pre>abs(-4)          # 4\nround(3.14159, 2) # 3.14\nmin(3, 1, 2)     # 1\nmax(3, 1, 2)     # 3</pre>
          <p><b>Задание:</b> для списка <code>nums = [-3.6, 2.4, 9.1]</code> найдите <code>biggest</code> (max), <code>nearest</code> — <code>round</code> первого элемента до целого, и выведите <code>abs(nums[0])</code>.</p>`,
        hint: "biggest = max(nums); nearest = round(nums[0]) — round(-3.6) даёт -4 (банковское? в Python 3 round half to even, но -3.6 не .5).",
        starter: "nums = [-3.6, 2.4, 9.1]\n",
        checks: [
          { desc: "biggest == 9.1", py: "assert biggest == 9.1" },
          { desc: "nearest == -4", py: "assert nearest == -4" },
          { desc: "Выведен модуль 3.6", stdoutIncludes: "3.6" }
        ]
      },
      {
        id: "math-mod",
        title: "Модуль math",
        theory: `
          <p><code>import math</code> открывает константы и функции: <code>math.pi</code>, <code>math.sqrt</code>, <code>math.floor</code>, <code>math.ceil</code>.</p>
          <pre>import math\nmath.sqrt(16)  # 4.0</pre>
          <p><b>Задание:</b> импортируйте <code>math</code>, положите в <code>root</code> корень из 81, в <code>area</code> — площадь круга радиуса 2 (<code>pi * r**2</code>). Выведите <code>root</code>.</p>`,
        hint: "area = math.pi * 2 ** 2",
        starter: "import math\n",
        checks: [
          { desc: "root == 9.0", py: "assert root == 9" },
          { desc: "area близка к 12.566", py: "import math as _m; assert abs(area - _m.pi * 4) < 1e-9" }
        ]
      }
    ]
  },
  {
    id: "strings",
    title: "Строки",
    blurb: "Индексы, срезы, методы и f-строки.",
    lessons: [
      {
        id: "index-slice",
        title: "Индексы и срезы",
        theory: `
          <p>Строка — последовательность символов. Индексация с нуля, отрицательные индексы с конца.</p>
          <pre>s = "Python"\ns[0]     # 'P'\ns[-1]    # 'n'\ns[0:2]   # 'Py'\ns[::2]   # 'Pto'</pre>
          <p>Срез <code>s[start:stop:step]</code> не включает <code>stop</code>.</p>
          <p><b>Задание:</b> <code>s = "encyclopedia"</code>. Сохраните первый символ в <code>first</code>, последние три в <code>tail</code>, перевёрнутую строку в <code>rev</code>.</p>`,
        hint: "rev = s[::-1]; tail = s[-3:]",
        starter: 's = "encyclopedia"\n',
        checks: [
          { desc: "first == 'e'", py: "assert first == 'e'" },
          { desc: "tail == 'dia'", py: "assert tail == 'dia'" },
          { desc: "rev — перевёрнутая строка", py: "assert rev == s[::-1]" }
        ]
      },
      {
        id: "str-methods",
        title: "Методы строк",
        theory: `
          <p>Методы не меняют исходную строку — возвращают новую.</p>
          <pre>t = "  Hello"\nt.strip().lower()   # 'hello'\n"a,b".split(",")    # ['a','b']\n"-".join(["a","b"]) # 'a-b'</pre>
          <p>Ещё: <code>replace</code>, <code>startswith</code>, <code>endswith</code>, <code>find</code>, <code>count</code>, <code>upper</code>.</p>
          <p><b>Задание:</b> <code>raw = "  PyThOn,Camp  "</code>. Получите <code>clean</code> — обрезанную, в нижнем регистре, запятая заменена на пробел.</p>`,
        hint: "chain: strip, lower, replace.",
        starter: 'raw = "  PyThOn,Camp  "\n',
        checks: [{ desc: "clean == 'python camp'", py: "assert clean == 'python camp'" }]
      },
      {
        id: "fstrings",
        title: "f-строки",
        theory: `
          <p>Форматирование через f-строки:</p>

const KEY = "pycamp-progress-v1";
const CODE_KEY = "pycamp-code-v1";
let pyodide = null;
let editor = null;
let currentId = null;
let completed = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let savedCode = JSON.parse(localStorage.getItem(CODE_KEY) || "{}");

function allLessons() {
  return COURSE.flatMap((s) => s.lessons.map((l) => ({ ...l, section: s.title, sectionId: s.id })));
}
function findLesson(id) {
  return allLessons().find((l) => l.id === id);
}
function saveProgress() {
  localStorage.setItem(KEY, JSON.stringify([...completed]));
  localStorage.setItem(CODE_KEY, JSON.stringify(savedCode));
  renderNav();
  updateProgress();
}
function updateProgress() {
  const n = allLessons().length;
  const c = completed.size;
  document.getElementById("prog-text").textContent = `${c} / ${n} заданий · ${Math.round((c / n) * 100)}%`;
  document.getElementById("prog-bar").style.width = `${(c / n) * 100}%`;
}

function renderNav(filter = "") {
  const q = filter.trim().toLowerCase();
  const nav = document.getElementById("nav");
  nav.innerHTML = `<div class="search"><input id="q" placeholder="Поиск урока…" value="${filter.replaceAll('"', "&quot;")}" /></div>`;
  COURSE.forEach((sec) => {
    const lessons = sec.lessons.filter((l) => !q || l.title.toLowerCase().includes(q) || sec.title.toLowerCase().includes(q));
    if (!lessons.length) return;
    const done = sec.lessons.filter((l) => completed.has(l.id)).length;
    const wrap = document.createElement("div");
    wrap.innerHTML = `<div class="sec-title">${sec.title}<small>${done}/${sec.lessons.length}</small></div>`;
    lessons.forEach((l) => {
      const row = document.createElement("div");
      row.className = "lesson-link" + (l.id === currentId ? " active" : "");
      row.innerHTML = `<span class="mark">${completed.has(l.id) ? "✓" : "○"}</span><span>${l.title}</span>`;
      row.onclick = () => openLesson(l.id);
      wrap.appendChild(row);
    });
    nav.appendChild(wrap);
  });
  const input = document.getElementById("q");
  input.oninput = () => renderNav(input.value);
}

function renderHome() {
  currentId = null;
  editor = null;
  const n = allLessons().length;
  const c = completed.size;
  const cert = c === n;
  document.getElementById("stage").innerHTML = `
    <div class="home">
      <div class="hero">
        <div class="kicker">Интерактивный курс</div>
        <h1>Python с нуля до проектов — прямо в браузере</h1>
        <p>Аналог freeCodeCamp: теория, редактор, автопроверки. Интерпретатор Python (CPython через Pyodide) выполняется у вас на машине. Прогресс хранится локально.</p>
        <p><button class="btn" id="start">${c ? "Продолжить" : "Начать курс"}</button></p>
      </div>
      <div class="cards" id="cards"></div>
      <div class="cert" id="cert">
        <h2 style="color:var(--gold);margin-top:0">Сертификат PyCamp</h2>
        <p>Все ${n} заданий курса выполнены. Введите имя для диплома:</p>
        <p><input id="cname" placeholder="Ваше имя" style="padding:8px;min-width:240px;background:#111;color:#fff;border:1px solid #555" />
        <button class="btn" id="printc">Показать</button></p>
        <div id="diploma"></div>
      </div>
    </div>`;
  const cards = document.getElementById("cards");
  COURSE.forEach((sec) => {
    const d = sec.lessons.filter((l) => completed.has(l.id)).length;
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `<h3>${sec.title}</h3><p>${sec.blurb}</p><p style="margin-top:8px;color:var(--gold)">${d}/${sec.lessons.length}</p>`;
    el.onclick = () => openLesson(sec.lessons[0].id);
    cards.appendChild(el);
  });
  const firstIncomplete = allLessons().find((l) => !completed.has(l.id));
  document.getElementById("start").onclick = () => openLesson((firstIncomplete || allLessons()[0]).id);
  if (cert) {
    document.getElementById("cert").style.display = "block";
    document.getElementById("printc").onclick = () => {
      const name = document.getElementById("cname").value.trim() || "Выпускник";
      document.getElementById("diploma").innerHTML = `
        <div style="margin-top:16px;padding:28px;border:1px solid var(--gold);text-align:center">
          <div style="letter-spacing:.2em;color:var(--gold)">PYCAMP</div>
          <h3>Сертификат прохождения</h3>
          <p>подтверждает, что</p>
          <h2>${name.replace(/[<>]/g,"")}</h2>
          <p>выполнил(а) полный курс Python: ${n} интерактивных заданий — основы, структуры данных, функции, ООП и проекты.</p>
        </div>`;
    };
  }
  renderNav();
}

function openLesson(id) {
  const lesson = findLesson(id);
  if (!lesson) return;
  currentId = id;
  const list = allLessons();
  const idx = list.findIndex((l) => l.id === id);
  const prev = list[idx - 1];
  const next = list[idx + 1];
  document.getElementById("stage").className = "";
  document.getElementById("stage").style.display = "contents";
  document.getElementById("stage").innerHTML = `
    <main class="workspace">
      <section class="theory">
        <div class="kicker">${lesson.section} · ${idx + 1} / ${list.length}</div>
        <h2>${lesson.title}</h2>
        ${lesson.theory}
        <div class="hint-box" id="hint">${lesson.hint || ""}</div>
      </section>
      <div class="lab">
        <div class="editor-col">
          <div class="lab-bar">
            <span>Редактор · Ctrl/⌘ + Enter запуск</span>
            <button class="btn ghost" id="btn-hint" type="button">Подсказка</button>
            <button class="btn ghost" id="btn-reset-code" type="button">Сбросить код</button>
            <button class="btn" id="btn-run" type="button">Запустить</button>
            <button class="btn ok" id="btn-check" type="button">Проверить</button>
          </div>
          <textarea id="code"></textarea>
        </div>
        <div class="out-col">
          <div class="lab-bar">
            <span>Консоль и тесты</span>
            ${prev ? `<button class="btn ghost" id="btn-prev" type="button">← Назад</button>` : ""}
            ${next ? `<button class="btn ghost" id="btn-next" type="button">Дальше →</button>` : `<button class="btn" id="btn-finish" type="button">К карте курса</button>`}
          </div>
          <div id="console">(вывод появится здесь)</div>
          <div id="tests">${lesson.checks.map((t) => `<div class="test">○ ${t.desc}</div>`).join("")}</div>
        </div>
      </div>
    </main>`;
  const start = savedCode[id] ?? lesson.starter;
  editor = CodeMirror.fromTextArea(document.getElementById("code"), {
    mode: "python",
    theme: "material-darker",
    lineNumbers: true,
    indentUnit: 4,
    extraKeys: {
      "Ctrl-Enter": () => runCode(false),
      "Cmd-Enter": () => runCode(false)
    }
  });
  editor.setValue(start);
  editor.on("change", () => {
    savedCode[id] = editor.getValue();
    localStorage.setItem(CODE_KEY, JSON.stringify(savedCode));
  });
  document.getElementById("btn-run").onclick = () => runCode(false);
  document.getElementById("btn-check").onclick = () => runCode(true);
  document.getElementById("btn-hint").onclick = () => {
    document.getElementById("hint").style.display = "block";
  };
  document.getElementById("btn-reset-code").onclick = () => {
    editor.setValue(lesson.starter);
  };
  const bp = document.getElementById("btn-prev");
  const bn = document.getElementById("btn-next");
  if (bp) bp.onclick = () => openLesson(prev.id);
  if (bn) bn.onclick = () => openLesson(next.id);
  const bf = document.getElementById("btn-finish");
  if (bf) bf.onclick = renderHome;
  renderNav(document.getElementById("q")?.value || "");
}

async function runCode(withTests) {
  const lesson = findLesson(currentId);
  const code = editor.getValue();
  const cons = document.getElementById("console");
  const testsEl = document.getElementById("tests");
  cons.textContent = "Выполнение…";
  try {
    pyodide.globals.set("_user_src", code);
    await pyodide.runPythonAsync(`
import sys, io, traceback
_out = io.StringIO()
sys.stdout = _out
sys.stderr = _out
_ns = {"__name__": "__main__"}
_err = None
try:
    exec(_user_src, _ns)
except Exception as e:
    _err = traceback.format_exc()
_stdout = _out.getvalue()
`);
    const err = pyodide.globals.get("_err");
    const stdout = pyodide.globals.get("_stdout") || "";
    cons.textContent = (err ? err : stdout) || "(нет вывода)";
    if (!withTests) return;
    if (err) {
      testsEl.innerHTML = lesson.checks.map((t) => `<div class="test fail">✕ ${t.desc} — код не выполнился</div>`).join("");
      return;
    }
    const results = [];
    for (const ch of lesson.checks) {
      if (ch.stdoutIncludes != null) {
        results.push({ ok: String(stdout).includes(ch.stdoutIncludes), desc: ch.desc });
        continue;
      }
      pyodide.globals.set("_check_src", ch.py);
      const ok = pyodide.runPython(`
_ok = False
_cerr = None
try:
    _env = dict(_ns)
    _env['_user_src'] = _user_src
    _env['_stdout'] = _stdout
    exec(_check_src, _env)
    _ok = True
except Exception as _e:
    _cerr = str(_e)
    _ok = False
_ok
`);
      results.push({ ok: !!ok, desc: ch.desc, extra: pyodide.globals.get("_cerr") });
    }
    testsEl.innerHTML = results
      .map((r) => `<div class="test ${r.ok ? "pass" : "fail"}">${r.ok ? "✓" : "✕"} ${r.desc}${r.ok || !r.extra ? "" : " — " + r.extra}</div>`)
      .join("");
    if (results.every((r) => r.ok)) {
      completed.add(currentId);
      saveProgress();
      cons.textContent = (stdout || "(нет вывода)") + "\n\nВсе проверки пройдены.";
    }
  } catch (e) {
    cons.textContent = String(e);
  }
}

document.getElementById("go-home").onclick = renderHome;
document.getElementById("btn-map").onclick = renderHome;
document.getElementById("btn-reset").onclick = () => {
  if (confirm("Сбросить весь прогресс и сохранённый код?")) {
    completed = new Set();
    savedCode = {};
    saveProgress();
    renderHome();
  }
};

(async function boot() {
  try {
    pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/" });
    document.getElementById("boot").hidden = true;
    updateProgress();
    renderHome();
    renderNav();
  } catch (e) {
    document.getElementById("boot-msg").textContent = "Не удалось загрузить Pyodide. Нужен интернет (CDN). " + e;
  }
})();
  </script>
