<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vibe — навигация</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --accent: #6ea8fe;
    --accent-2: #b18cff;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --border: #262b35;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(24px, 5vw, 64px) 16px;
  }
  header { text-align: center; margin-bottom: 40px; }
  h1 {
    font-size: clamp(28px, 6vw, 44px);
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p { color: var(--muted); margin-top: 8px; }
  nav {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 900px;
  }
  a.card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 20px 22px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  a.card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 8px 24px rgba(110, 168, 254, 0.12);
  }
  .card .name { font-weight: 600; font-size: 16px; }
  .card .file { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; color: var(--muted); }
  .card .arrow { color: var(--accent); font-size: 18px; align-self: flex-end; }
  footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <header>
    <h1>vibe</h1>
    <p>Навигация по файлам проекта</p>
  </header>

  <nav>
    <a class="card" href="claude_sonnet5_5.html">
      <span class="name">Claude Sonnet 5.5</span>
      <span class="file">claude_sonnet5_5.html</span>
      <span class="arrow">→</span>
    </a>
    <a class="card" href="cursor.html">
      <span class="name">Cursor</span>
      <span class="file">cursor.html</span>
      <span class="arrow">→</span>
    </a>
    <a class="card" href="gigachat.html">
      <span class="name">GigaChat</span>
      <span class="file">gigachat.html</span>
      <span class="arrow">→</span>
    </a>
    <a class="card" href="qwen_web_code.html">
      <span class="name">Qwen Web Code</span>
      <span class="file">qwen_web_code.html</span>
      <span class="arrow">→</span>
    </a>
    <a class="card" href="Zoo_code(claude).html">
      <span class="name">Zoo Code (Claude)</span>
      <span class="file">Zoo_code(claude).html</span>
      <span class="arrow">→</span>
    </a>
  </nav>

  <footer>5 файлов · открытие в текущей вкладке</footer>
</body>
</html>
